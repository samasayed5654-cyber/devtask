<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff66"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer glowing hexagon / shield -->
  <polygon points="60,6 110,33 110,87 60,114 10,87 10,33" fill="#0d1117" stroke="url(#cyberGrad)" stroke-width="4" filter="url(#glow)"/>
  <polygon points="60,14 102,37 102,83 60,106 18,83 18,37" fill="#141a24" stroke="#00ff66" stroke-width="1" stroke-opacity="0.3"/>
  
  <!-- Code brackets & underscore logo >_ -->
  <g transform="translate(24, 28)">
    <path d="M12,14 L30,32 L12,50" fill="none" stroke="url(#cyberGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="38" y1="52" x2="62" y2="52" stroke="#00ff66" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
