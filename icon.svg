<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="appGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff66"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Icon Background (Squircle) -->
  <rect width="512" height="512" rx="116" fill="#0d1117"/>
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="url(#appGrad)" stroke-width="8" stroke-opacity="0.8" filter="url(#glow512)"/>
  
  <!-- Cyber Hexagon Center -->
  <polygon points="256,70 410,160 410,350 256,440 102,350 102,160" fill="#141a24" stroke="#00ff66" stroke-width="4" stroke-opacity="0.4"/>
  
  <!-- >_ Terminal Symbol -->
  <g transform="translate(110, 140)">
    <path d="M40,50 L120,120 L40,190" fill="none" stroke="url(#appGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="150" y1="195" x2="250" y2="195" stroke="#00ff66" stroke-width="26" stroke-linecap="round"/>
  </g>
</svg>
